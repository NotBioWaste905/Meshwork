name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meshwork/backend_rs

    services:
      falkordb:
        # Keep in sync with compose.yaml
        image: falkordb/falkordb:v4.22.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      FALKORDB_URL: falkor://localhost:6379
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: meshwork/backend_rs

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Integration tests
        run: cargo test -- --include-ignored

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meshwork/frontend/webapp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meshwork/frontend/webapp/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build
