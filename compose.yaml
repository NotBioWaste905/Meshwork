name: meshwork
services:
  backend:
    build: ./meshwork/backend_rs
    environment:
      - FALKORDB_URL=falkor://falkordb:6379
      - CORS_ALLOW_ORIGINS=http://localhost:3000,http://localhost:5173 # UI in compose, npm run dev
    ports:
      - "8000:8000"
    depends_on:
      - falkordb
  frontend:
    build: ./meshwork/frontend/webapp
    ports:
      - "3000:3000"
    depends_on:
      - backend
  mcp:
    build: ./meshwork/mcp_rs
    environment:
      # Clients authenticate with actor tokens checked by the backend; issue one with
      # `docker compose exec -T backend meshwork-token create <actor>`.
      - BACKEND_URL=http://backend:8000
    ports:
      - "127.0.0.1:8080:8080" # loopback only: rmcp accepts only loopback Host headers by default
    depends_on:
      - backend
  falkordb:
    image: falkordb/falkordb:v4.22.2 # keep in sync with .github/workflows/ci.yml
    environment:
      # Append-only file: every write hits disk within ~1s. An existing volume with
      # only dump.rdb must be migrated first, see docs/operations.md.
      - REDIS_ARGS=--appendonly yes --appendfsync everysec
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    ports:
      - "6379:6379" # Redis protocol (backend)
      - "3001:3000" # FalkorDB browser UI (3000 is taken by the frontend)
    restart: always

volumes:
  falkordb_data:

networks:
  default:
