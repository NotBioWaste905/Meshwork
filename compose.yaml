name: meshwork
services:
  backend:
    build: ./meshwork/backend_rs
    environment:
      - FALKORDB_URL=falkor://falkordb:6379
      - CORS_ALLOW_ORIGINS=http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - falkordb
  frontend:
    build: ./meshwork/frontend/webapp
    ports:
      - "3000:3000"
    depends_on:
      - backend
  falkordb:
    image: falkordb/falkordb:latest
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    ports:
      - "6379:6379" # Redis protocol (backend)
      - "3001:3000" # FalkorDB browser UI (3000 is taken by the frontend)
    restart: always

volumes:
  falkordb_data:

networks:
  default:
