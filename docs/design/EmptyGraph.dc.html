<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New graph</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;color:#12161C;background:#F4F6F8}
a{color:#2349C7}a:hover{color:#1A3694}
button,input{font-family:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #2349C7;outline-offset:2px}
</style>
</helmet>
<div style="display:flex;min-height:900px;background:#F4F6F8">
  <nav aria-label="Primary" style="width:64px;flex:none;background:#12161C;display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px;box-sizing:border-box">
    <a href="Graphs.dc.html" aria-label="Meshwork home" style="width:36px;height:36px;border-radius:10px;background:#2349C7;display:flex;align-items:center;justify-content:center;margin-bottom:16px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.3 11l7.4-4M8.3 13l7.4 4"/></svg></a>
    <a href="Graphs.dc.html" aria-label="Graphs" aria-current="page" style="width:44px;height:44px;border-radius:10px;background:#27303B;color:#fff;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></a>
    <a href="User.dc.html" aria-label="My work" style="width:44px;height:44px;border-radius:10px;color:#AEB7C2;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg></a>
    <div style="flex:1"></div>
    <a href="Settings.dc.html" aria-label="Settings" style="width:44px;height:44px;border-radius:10px;color:#AEB7C2;display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></a>
    <a href="User.dc.html" aria-label="Your profile" style="width:36px;height:36px;border-radius:50%;background:#2349C7;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;text-decoration:none;margin-top:4px">AC</a>
  </nav>

  <main style="flex:1;min-width:0;display:flex;flex-direction:column;background-image:radial-gradient(#C9D0D8 1.2px,transparent 1.2px);background-size:22px 22px">
    <header style="min-height:60px;background:#fff;border-bottom:1px solid #DDE2E8;display:flex;align-items:center;gap:8px;padding:0 32px;font-size:15px">
      <a href="Graphs.dc.html" style="color:#5B6572;text-decoration:none">Graphs</a><span style="color:#8995A5">/</span><strong style="font-weight:600">New graph</strong>
    </header>

    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;padding:48px 24px;box-sizing:border-box">
      <svg viewBox="0 0 440 150" style="width:100%;max-width:440px;height:auto" role="img" aria-label="Empty graph: a dashed placeholder task leading to a goal node" fill="none">
        <defs><marker id="em" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6B7684"/></marker></defs>
        <g stroke="#8995A5" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#em)"><path d="M130 40 C190 40 190 75 250 75"/><path d="M130 110 C190 110 190 75 250 75"/></g>
        <g font-family="IBM Plex Sans, sans-serif" font-size="14" font-weight="500">
          <rect x="10" y="20" width="120" height="40" rx="10" fill="#fff" stroke="#8995A5" stroke-width="1.5" stroke-dasharray="5 4"/><text x="28" y="45" fill="#5B6572">Task</text>
          <rect x="10" y="90" width="120" height="40" rx="10" fill="#fff" stroke="#8995A5" stroke-width="1.5" stroke-dasharray="5 4"/><text x="28" y="115" fill="#5B6572">Task</text>
          <rect x="250" y="47" width="180" height="56" rx="12" fill="#12161C"/><text x="270" y="80" fill="#fff" font-size="16" font-weight="600">Your goal</text>
        </g>
      </svg>

      <div style="max-width:520px;text-align:center;display:flex;flex-direction:column;gap:10px">
        <h1 style="margin:0;font-size:32px;line-height:1.2;font-weight:600;letter-spacing:-0.02em">Start with the goal</h1>
        <p style="margin:0;font-size:16px;line-height:1.55;color:#3E4753">Name the one thing everything else leads to. You will break it down into tasks and blockers next.</p>
      </div>

      <form style="width:100%;max-width:520px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
        <div style="flex:1 1 280px;display:flex;flex-direction:column;gap:6px">
          <label for="goal" style="font-size:14px;font-weight:500">Goal</label>
          <input id="goal" type="text" placeholder="Ship the billing service" style="height:48px;box-sizing:border-box;padding:0 14px;border:1px solid #B9C1CB;border-radius:10px;font-size:16px;background:#fff;color:#12161C">
        </div>
        <a href="Graph.dc.html" style="height:48px;padding:0 22px;border-radius:10px;background:#2349C7;color:#fff;font-size:16px;font-weight:600;display:flex;align-items:center;text-decoration:none">Create graph</a>
      </form>

      <div style="width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px">
        <span style="font-size:14px;color:#5B6572">Or start from a template</span>
        <div style="display:flex;flex-wrap:wrap;gap:10px">
          <button style="height:44px;padding:0 16px;border-radius:10px;border:1px solid #B9C1CB;background:#fff;font-size:14px;font-weight:500;color:#12161C">Software release</button>
          <button style="height:44px;padding:0 16px;border-radius:10px;border:1px solid #B9C1CB;background:#fff;font-size:14px;font-weight:500;color:#12161C">Hiring pipeline</button>
          <button style="height:44px;padding:0 16px;border-radius:10px;border:1px solid #B9C1CB;background:#fff;font-size:14px;font-weight:500;color:#12161C">Incident response</button>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
